<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康画像与菜品偏好调查</title>
    <style>
        /* 保持原有的所有CSS样式不变，与您提供的第五部分完全一致 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .section-title {
            display: flex;
            align-items: center;
            margin: 25px 0 15px;
            color: #2c3e50;
            font-size: 20px;
        }

        .required {
            color: #e74c3c;
            margin-left: 5px;
        }

        .form-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eaeaea;
        }

            .form-section h3 {
                margin-bottom: 15px;
                color: #2c3e50;
                display: flex;
                align-items: center;
            }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .form-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

            .form-option:hover {
                background: #e9ecef;
            }

            .form-option.selected {
                background: #3498db;
                color: white;
            }

            .form-option input {
                margin: 0;
            }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

            .input-group input {
                padding: 10px 15px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 16px;
                width: 150px;
            }

            .input-group span {
                color: #7f8c8d;
            }

        .control-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

            .search-box input {
                width: 100%;
                padding: 12px 15px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 16px;
                transition: all 0.3s;
            }

                .search-box input:focus {
                    border-color: #3498db;
                    box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
                    outline: none;
                }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .select-all {
            background-color: #3498db;
            color: white;
        }

            .select-all:hover {
                background-color: #2980b9;
            }

        .deselect-all {
            background-color: #e74c3c;
            color: white;
        }

            .deselect-all:hover {
                background-color: #c0392b;
            }

        .submit-btn {
            background-color: #2ecc71;
            color: white;
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

            .submit-btn:hover {
                background-color: #27ae60;
            }

            .submit-btn:disabled {
                background-color: #95a5a6;
                cursor: not-allowed;
            }

        .empty-state {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
        }

        .info-summary {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

            .info-summary h3 {
                margin-bottom: 15px;
                color: #2c3e50;
            }

        .info-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .info-item {
            padding: 8px 12px;
            background: white;
            border-radius: 6px;
            font-size: 14px;
        }

        .info-label {
            font-weight: 600;
            color: #7f8c8d;
        }

        .preference-section {
            margin-bottom: 30px;
        }

        .preference-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .preference-card {
            background: white;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .preference-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .preference-buttons {
            display: flex;
            gap: 10px;
        }

        .pref-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .like-btn {
            background-color: #e8f6f3;
            color: #27ae60;
            border: 1px solid #27ae60;
        }

            .like-btn:hover, .like-btn.selected {
                background-color: #27ae60;
                color: white;
            }

        .dislike-btn {
            background-color: #fdedec;
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }

            .dislike-btn:hover, .dislike-btn.selected {
                background-color: #e74c3c;
                color: white;
            }

        .preference-summary {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .preference-category {
            flex: 1;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
        }

            .preference-category h4 {
                margin-bottom: 10px;
                color: #2c3e50;
            }

        .preference-list {
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
        }

        .preference-item {
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .preference-item .remove-btn {
                color: #7f8c8d;
            }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .control-panel {
                flex-direction: column;
            }

            .buttons {
                width: 100%;
                justify-content: space-between;
            }

            button {
                flex: 1;
            }

            .form-group {
                flex-direction: column;
            }

            .input-group input {
                width: 100%;
            }

            .info-list {
                grid-template-columns: 1fr;
            }

            .preference-options {
                grid-template-columns: 1fr;
            }

            .preference-summary {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>健康画像与菜品偏好调查</h1>
        <p class="subtitle">请填写您的健康信息并告诉我们您对菜品的偏好</p>

        <!-- 个人信息收集部分 -->
        <div class="section-title">
            个人信息收集 <span class="required">*</span>
        </div>

        <div class="form-section">
            <h3>请选择您的性别 <span class="required">*</span></h3>
            <div class="form-group">
                <label class="form-option">
                    <input type="radio" name="gender" value="male" required>
                    <span>男</span>
                </label>
                <label class="form-option">
                    <input type="radio" name="gender" value="female" required>
                    <span>女</span>
                </label>
            </div>
        </div>

        <div class="form-section">
            <h3>请选择您的年龄组 <span class="required">*</span></h3>
            <div class="form-group">
                <label class="form-option">
                    <input type="radio" name="age" value="18-64" required>
                    <span>18~64岁</span>
                </label>
                <label class="form-option">
                    <input type="radio" name="age" value="65+" required>
                    <span>65岁及以上</span>
                </label>
            </div>
        </div>

        <div class="form-section">
            <h3>请选择您的体重 <span class="required">*</span></h3>
            <div class="input-group">
                <input type="number" id="weight" placeholder="请输入体重" min="30" max="200" required>
                <span>公斤</span>
            </div>
        </div>

        <div class="form-section">
            <h3>请选择您的慢性病类型 <span class="required">（可多选）</span></h3>
            <div class="form-group">
                <label class="form-option">
                    <input type="checkbox" name="disease" value="痛风">
                    <span>痛风</span>
                </label>
                <label class="form-option">
                    <input type="checkbox" name="disease" value="糖尿病">
                    <span>糖尿病</span>
                </label>
                <label class="form-option">
                    <input type="checkbox" name="disease" value="高血压">
                    <span>高血压</span>
                </label>
                <label class="form-option">
                    <input type="checkbox" name="disease" value="心脑血管疾病">
                    <span>心脑血管疾病</span>
                </label>
            </div>
        </div>

        <div class="form-section">
            <h3>请选择您的病情严重程度</h3>
            <div class="form-group">
                <label class="form-option">
                    <input type="radio" name="severity" value="轻度">
                    <span>轻度</span>
                </label>
                <label class="form-option">
                    <input type="radio" name="severity" value="中度">
                    <span>中度</span>
                </label>
                <label class="form-option">
                    <input type="radio" name="severity" value="重度">
                    <span>重度</span>
                </label>
            </div>
        </div>

        <!-- 个人信息摘要 -->
        <div class="info-summary">
            <h3>您的健康画像</h3>
            <div class="info-list" id="infoSummary">
                <div class="info-item"><span class="info-label">性别:</span> <span id="genderSummary">未选择</span></div>
                <div class="info-item"><span class="info-label">年龄组:</span> <span id="ageSummary">未选择</span></div>
                <div class="info-item"><span class="info-label">体重:</span> <span id="weightSummary">未输入</span></div>
                <div class="info-item"><span class="info-label">慢性病:</span> <span id="diseaseSummary">未选择</span></div>
                <div class="info-item"><span class="info-label">严重程度:</span> <span id="severitySummary">未选择</span></div>
            </div>
        </div>

        <!-- 菜品偏好调查部分 -->
        <div class="section-title">
            菜品偏好调查 <span class="required">*</span>
        </div>

        <div class="preference-section">
            <p class="subtitle">请告诉我们您对以下菜品的偏好</p>

            <div class="control-panel">
                <div class="search-box">
                    <input type="text" id="prefSearch" placeholder="搜索菜品...">
                </div>
                <div class="buttons">
                    <button class="select-all" id="selectAllLikes">全选喜欢</button>
                    <button class="deselect-all" id="clearPreferences">清除偏好</button>
                </div>
            </div>

            <div class="preference-options" id="preferenceOptions">
                <!-- 偏好选项将通过JavaScript动态生成 -->
            </div>

            <div class="preference-summary">
                <div class="preference-category">
                    <h4>喜欢的菜品 (<span id="likeCount">0</span>)</h4>
                    <div class="preference-list" id="likeList">
                        <div class="empty-state">暂无喜欢的菜品</div>
                    </div>
                </div>
                <div class="preference-category">
                    <h4>不喜欢的菜品 (<span id="dislikeCount">0</span>)</h4>
                    <div class="preference-list" id="dislikeList">
                        <div class="empty-state">暂无不喜欢菜品</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 加载状态 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在分析您的信息，生成个性化推荐...</p>
        </div>

        <button class="submit-btn" id="submitBtn" disabled>生成个性化饮食推荐</button>
    </div>

    <script>
        // 菜品数据 - 与后端算法中的菜品名称保持一致
        const options = [
            { id: 1, title: "红烧肉", description: "猪肉（五花）" },
            { id: 2, title: "番茄炒蛋", description: "西红柿，鸡蛋" },
            { id: 3, title: "蒜蓉上海青", description: "上海青" },
            { id: 4, title: "酸辣土豆丝", description: "土豆" },
            { id: 5, title: "鱼香肉丝", description: "猪肉（瘦），木耳，胡萝卜，莴笋" },
            { id: 6, title: "宫保鸡丁", description: "鸡肉（鸡胸），花生，干辣椒" },
            { id: 7, title: "麻婆豆腐", description: "豆腐（北豆腐），猪肉（瘦）" },
            { id: 8, title: "清蒸鲈鱼", description: "鲈鱼" },
            { id: 9, title: "地三鲜", description: "茄子，土豆，青椒" },
            { id: 10, title: "京酱肉丝", description: "猪肉（瘦），豆腐皮" },
            { id: 11, title: "葱油手撕鸡", description: "鸡肉（鸡腿）" },
            { id: 12, title: "糖醋里脊", description: "猪肉（瘦），鸡蛋" },
            { id: 13, title: "清炒虾仁", description: "虾（河虾），黄瓜，胡萝卜" },
            { id: 14, title: "蒜蓉西兰花", description: "西兰花" },
            { id: 15, title: "木须肉", description: "猪肉（瘦），鸡蛋，黄瓜，木耳" },
            { id: 16, title: "西红柿鸡蛋汤", description: "西红柿，鸡蛋" },
            { id: 17, title: "鲫鱼豆腐汤", description: "鲫鱼，豆腐（北豆腐）" },
            { id: 18, title: "冬瓜肉丸汤", description: "猪肉（瘦），冬瓜，鸡蛋" },
            { id: 19, title: "红烧茄子", description: "茄子，猪肉（瘦）" },
            { id: 20, title: "葱爆羊肉", description: "羊肉（瘦）" }
        ];

        // 菜品偏好
        let likedOptions = new Set();
        let dislikedOptions = new Set();

        // DOM元素
        const submitBtn = document.getElementById('submitBtn');
        const loadingElement = document.getElementById('loading');

        // 偏好调查DOM元素
        const preferenceOptions = document.getElementById('preferenceOptions');
        const likeList = document.getElementById('likeList');
        const dislikeList = document.getElementById('dislikeList');
        const likeCount = document.getElementById('likeCount');
        const dislikeCount = document.getElementById('dislikeCount');
        const prefSearchInput = document.getElementById('prefSearch');
        const selectAllLikesBtn = document.getElementById('selectAllLikes');
        const clearPreferencesBtn = document.getElementById('clearPreferences');

        // 个人信息DOM元素
        const genderInputs = document.querySelectorAll('input[name="gender"]');
        const ageInputs = document.querySelectorAll('input[name="age"]');
        const weightInput = document.getElementById('weight');
        const diseaseInputs = document.querySelectorAll('input[name="disease"]');
        const severityInputs = document.querySelectorAll('input[name="severity"]');

        // 个人信息摘要DOM元素
        const genderSummary = document.getElementById('genderSummary');
        const ageSummary = document.getElementById('ageSummary');
        const weightSummary = document.getElementById('weightSummary');
        const diseaseSummary = document.getElementById('diseaseSummary');
        const severitySummary = document.getElementById('severitySummary');

        // 初始化偏好选项
        function initializePreferenceOptions() {
            preferenceOptions.innerHTML = '';
            options.forEach(option => {
                const prefCard = document.createElement('div');
                prefCard.className = 'preference-card';
                prefCard.dataset.id = option.id;

                prefCard.innerHTML = `
                            <div class="preference-title">${option.title}</div>
                            <div class="option-description">${option.description}</div>
                            <div class="preference-buttons">
                                <button class="pref-btn like-btn" data-id="${option.id}" data-type="like">喜欢</button>
                                <button class="pref-btn dislike-btn" data-id="${option.id}" data-type="dislike">不喜欢</button>
                            </div>
                        `;

                // 添加按钮事件
                const likeBtn = prefCard.querySelector('.like-btn');
                const dislikeBtn = prefCard.querySelector('.dislike-btn');

                likeBtn.addEventListener('click', () => {
                    togglePreference(option.id, 'like');
                });

                dislikeBtn.addEventListener('click', () => {
                    togglePreference(option.id, 'dislike');
                });

                preferenceOptions.appendChild(prefCard);
            });

            updatePreferenceUI();
        }

        // 切换偏好选择
        function togglePreference(id, type) {
            if (type === 'like') {
                dislikedOptions.delete(id);
                likedOptions.add(id);
            } else {
                likedOptions.delete(id);
                dislikedOptions.add(id);
            }
            updatePreferenceUI();
        }

        // 移除偏好
        function removePreference(id) {
            likedOptions.delete(id);
            dislikedOptions.delete(id);
            updatePreferenceUI();
        }

        // 更新偏好UI
        function updatePreferenceUI() {
            // 更新偏好按钮状态
            document.querySelectorAll('.preference-card').forEach(card => {
                const id = parseInt(card.dataset.id);
                const likeBtn = card.querySelector('.like-btn');
                const dislikeBtn = card.querySelector('.dislike-btn');

                likeBtn.classList.remove('selected');
                dislikeBtn.classList.remove('selected');

                if (likedOptions.has(id)) {
                    likeBtn.classList.add('selected');
                } else if (dislikedOptions.has(id)) {
                    dislikeBtn.classList.add('selected');
                }
            });

            // 更新喜欢列表
            if (likedOptions.size === 0) {
                likeList.innerHTML = '<div class="empty-state">暂无喜欢的菜品</div>';
            } else {
                likeList.innerHTML = '';
                likedOptions.forEach(id => {
                    const option = options.find(opt => opt.id === id);
                    const prefItem = document.createElement('div');
                    prefItem.className = 'preference-item';
                    prefItem.innerHTML = `
                                ${option.title}
                                <button class="remove-btn" data-id="${id}">×</button>
                            `;
                    prefItem.querySelector('.remove-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        removePreference(id);
                    });
                    likeList.appendChild(prefItem);
                });
            }

            // 更新不喜欢列表
            if (dislikedOptions.size === 0) {
                dislikeList.innerHTML = '<div class="empty-state">暂无不喜欢菜品</div>';
            } else {
                dislikeList.innerHTML = '';
                dislikedOptions.forEach(id => {
                    const option = options.find(opt => opt.id === id);
                    const prefItem = document.createElement('div');
                    prefItem.className = 'preference-item';
                    prefItem.innerHTML = `
                                ${option.title}
                                <button class="remove-btn" data-id="${id}">×</button>
                            `;
                    prefItem.querySelector('.remove-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        removePreference(id);
                    });
                    dislikeList.appendChild(prefItem);
                });
            }

            likeCount.textContent = likedOptions.size;
            dislikeCount.textContent = dislikedOptions.size;

            updateSubmitButtonState();
        }

        // 偏好搜索功能
        prefSearchInput.addEventListener('input', () => {
            const searchTerm = prefSearchInput.value.toLowerCase();
            document.querySelectorAll('.preference-card').forEach(card => {
                const id = parseInt(card.dataset.id);
                const option = options.find(opt => opt.id === id);
                const title = option.title.toLowerCase();
                const description = option.description.toLowerCase();
                card.style.display = (title.includes(searchTerm) || description.includes(searchTerm)) ? 'block' : 'none';
            });
        });

        // 全选喜欢功能
        selectAllLikesBtn.addEventListener('click', () => {
            options.forEach(option => {
                likedOptions.add(option.id);
                dislikedOptions.delete(option.id);
            });
            updatePreferenceUI();
        });

        // 清除偏好功能
        clearPreferencesBtn.addEventListener('click', () => {
            likedOptions.clear();
            dislikedOptions.clear();
            updatePreferenceUI();
        });

        // 提交数据到后端
        async function submitFormData(formData) {
            try {
                console.log('提交数据到后端:', formData);
                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('提交数据失败:', error);
                throw error;
            }
        }

        // 显示加载动画
        function showLoading() {
            loadingElement.style.display = 'block';
            submitBtn.disabled = true;
        }

        // 隐藏加载动画
        function hideLoading() {
            loadingElement.style.display = 'none';
            submitBtn.disabled = false;
        }

        // 显示错误信息
        function showError(message) {
            alert('错误: ' + message);
            console.error('错误信息:', message);
        }

        // 提交功能 - 修改为调用后端API并附带用户名
        submitBtn.addEventListener('click', async () => {
            // 收集个人信息
            const gender = document.querySelector('input[name="gender"]:checked');
            const age = document.querySelector('input[name="age"]:checked');
            const weight = weightInput.value;
            const diseases = Array.from(document.querySelectorAll('input[name="disease"]:checked')).map(d => d.value);
            const severity = document.querySelector('input[name="severity"]:checked');

            // 收集偏好信息
            const likedItems = Array.from(likedOptions).map(id => {
                const option = options.find(opt => opt.id === id);
                return option.title;
            });
            const dislikedItems = Array.from(dislikedOptions).map(id => {
                const option = options.find(opt => opt.id === id);
                return option.title;
            });

            // 从 localStorage 获取当前登录用户名
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                showError('请先登录');
                window.location.href = '/login';
                return;
            }

            // 构建符合后端API要求的数据格式，并附带 username 字段
            const formData = {
                username: currentUser.username,  // 新增：将用户名传递给后端
                userInfo: {
                    age: age.value === '18-64' ? 35 : 70,
                    gender: gender.value,
                    height: 170, // 简化处理
                    weight: parseFloat(weight),
                    diseases: diseases.length > 0 ? diseases : ["痛风"],
                    symptomSeverity: severity ? severity.value : "轻度",
                    dietaryRestrictions: []
                },
                likedDishes: likedItems,
                dislikedDishes: dislikedItems
            };

            console.log('准备提交的表单数据:', formData);

            showLoading();
            try {
                const response = await submitFormData(formData);
                if (response.success) {
                    localStorage.setItem('recommendationData', JSON.stringify(response.recommendation));
                    // 跳转到推荐结果页面
                    window.location.href = '/recommend';
                } else {
                    showError('推荐生成失败：' + (response.error || '未知错误'));
                }
            } catch (error) {
                console.error('提交错误:', error);
                showError('网络错误，请检查连接后重试: ' + error.message);
            } finally {
                hideLoading();
            }
        });

        // 更新个人信息摘要
        function updateInfoSummary() {
            const gender = document.querySelector('input[name="gender"]:checked');
            genderSummary.textContent = gender ? (gender.value === 'male' ? '男' : '女') : '未选择';
            const age = document.querySelector('input[name="age"]:checked');
            ageSummary.textContent = age ? (age.value === '18-64' ? '18~64岁' : '65岁及以上') : '未选择';
            weightSummary.textContent = weightInput.value ? `${weightInput.value} 公斤` : '未输入';
            const diseases = Array.from(document.querySelectorAll('input[name="disease"]:checked')).map(d => d.value);
            diseaseSummary.textContent = diseases.length > 0 ? diseases.join(', ') : '无';
            const severity = document.querySelector('input[name="severity"]:checked');
            severitySummary.textContent = severity ? severity.value : '未选择';
            updateSubmitButtonState();
        }

        // 更新提交按钮状态
        function updateSubmitButtonState() {
            const gender = document.querySelector('input[name="gender"]:checked');
            const age = document.querySelector('input[name="age"]:checked');
            const weight = weightInput.value;
            const isPersonalInfoComplete = gender && age && weight;
            const isPreferenceComplete = likedOptions.size > 0 || dislikedOptions.size > 0;
            submitBtn.disabled = !(isPersonalInfoComplete && isPreferenceComplete);
        }

        // 为所有个人信息输入添加事件监听
        genderInputs.forEach(input => input.addEventListener('change', updateInfoSummary));
        ageInputs.forEach(input => input.addEventListener('change', updateInfoSummary));
        weightInput.addEventListener('input', updateInfoSummary);
        diseaseInputs.forEach(input => input.addEventListener('change', updateInfoSummary));
        severityInputs.forEach(input => input.addEventListener('change', updateInfoSummary));

        // 为表单选项添加选中样式
        document.querySelectorAll('.form-option').forEach(option => {
            option.addEventListener('click', function () {
                const input = this.querySelector('input');
                if (input.type === 'radio') {
                    document.querySelectorAll(`input[name="${input.name}"]`).forEach(radio => {
                        radio.closest('.form-option').classList.remove('selected');
                    });
                }
                if (input.type === 'checkbox') {
                    this.classList.toggle('selected', input.checked);
                } else {
                    this.classList.add('selected');
                }
            });
        });

        // 初始化
        initializePreferenceOptions();
        updateInfoSummary();
    </script>
</body>
</html>
